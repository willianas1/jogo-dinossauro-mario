<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>

  <!-- Neon border -->
  <rect x="10" y="10" width="492" height="492" fill="none"
        stroke="#66fcf1" stroke-width="5" rx="72" opacity="0.55" filter="url(#glow)"/>

  <!-- Mario cap (red) -->
  <rect x="186" y="98" width="140" height="20" fill="#E52521" rx="4"/>
  <rect x="166" y="118" width="180" height="70" fill="#E52521" rx="10"/>

  <!-- Face (skin) -->
  <rect x="186" y="188" width="140" height="64" fill="#F8B888" rx="8"/>

  <!-- Eyes -->
  <rect x="210" y="200" width="30" height="24" fill="white" rx="4"/>
  <rect x="272" y="200" width="30" height="24" fill="white" rx="4"/>
  <rect x="218" y="206" width="16" height="14" fill="#2a0a00" rx="3"/>
  <rect x="280" y="206" width="16" height="14" fill="#2a0a00" rx="3"/>

  <!-- Moustache -->
  <rect x="196" y="232" width="120" height="12" fill="#7A4300" rx="6"/>

  <!-- Overalls (blue) -->
  <rect x="176" y="252" width="160" height="80" fill="#0020C2" rx="8"/>

  <!-- Buttons (yellow) -->
  <rect x="244" y="260" width="14" height="14" fill="#F8D800" rx="3"/>
  <rect x="254" y="260" width="14" height="14" fill="#F8D800" rx="3"/>

  <!-- Legs -->
  <rect x="186" y="330" width="56" height="50" fill="#0020C2" rx="6"/>
  <rect x="270" y="330" width="56" height="50" fill="#0020C2" rx="6"/>

  <!-- Shoes (brown) -->
  <rect x="180" y="375" width="68" height="22" fill="#7A4300" rx="8"/>
  <rect x="264" y="375" width="68" height="22" fill="#7A4300" rx="8"/>

  <!-- Stars in background -->
  <circle cx="90"  cy="90"  r="5" fill="#66fcf1" opacity="0.6"/>
  <circle cx="420" cy="80"  r="7" fill="#f1c40f" opacity="0.7"/>
  <circle cx="430" cy="160" r="4" fill="#66fcf1" opacity="0.5"/>
  <circle cx="80"  cy="200" r="6" fill="#f1c40f" opacity="0.4"/>
  <circle cx="450" cy="290" r="5" fill="#66fcf1" opacity="0.5"/>

  <!-- Game title -->
  <text x="256" y="450" text-anchor="middle"
        fill="#ffffff" font-size="44" font-family="'Courier New', monospace"
        font-weight="bold" letter-spacing="3" filter="url(#glow)">MARIO</text>
  <text x="256" y="492" text-anchor="middle"
        fill="#66fcf1" font-size="28" font-family="'Courier New', monospace"
        letter-spacing="8" opacity="0.9">RUNNER</text>
</svg>
